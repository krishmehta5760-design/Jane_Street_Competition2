# Tiny Tapeout project information
project:
  title:        "ProtoEmu - Protocol Emulator"
  author:       "KRISH MEHTA"
  discord:      ""
  description:  "Programmable protocol emulator supporting SPI, I2C, JTAG, PS/2 and UART"
  language:     "Verilog"
  clock_hz:     50000000
  tiles: "6x4"
  top_module:  "tt_um_yourname_protoemu"
  source_files:
    - "project.v"
    - "top.v"
    - "baud_gen.v"
    - "branch_unit.v"
    - "byte_buf.v"
    - "control_unit.v"
    - "decoder.v"
    - "delay_counter.v"
    - "gpio_block.v"
    - "imem.v"
    - "isr.v"
    - "osr.v"
    - "pc.v"
    - "x_register.v"
pinout:
  ui[0]: "host_run"
  ui[1]: "host_wr"
  ui[2]: "tx_wr"
  ui[3]: "rx_rd"
  ui[4]: "host_waddr[0]"
  ui[5]: "host_waddr[1]"
  ui[6]: "host_waddr[2]"
  ui[7]: "host_waddr[3]"
  uo[0]: "tx_full"
  uo[1]: "rx_valid"
  uo[2]: "rx_rdata[0]"
  uo[3]: "rx_rdata[1]"
  uo[4]: "rx_rdata[2]"
  uo[5]: "rx_rdata[3]"
  uo[6]: "rx_rdata[4]"
  uo[7]: "rx_rdata[5]"
  uio[0]: "gpio[0] / SDA"
  uio[1]: "gpio[1] / SCL"
  uio[2]: "gpio[2] / CS"
  uio[3]: "gpio[3] / SCK"
  uio[4]: "gpio[4] / MOSI"
  uio[5]: "gpio[5] / MISO"
  uio[6]: "gpio[6]"
  uio[7]: "gpio[7]"
yaml_version: 6
